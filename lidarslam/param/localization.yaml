scan_matcher:
  ros__parameters:
    global_frame_id: "map"
    robot_frame_id: "base_link"
    registration_method: "NDT"
    # NOTE (2026-06-05): tried ndt_resolution=1.0 + vg_size_for_input=0.15
    # to improve accuracy, but it (a) dropped real-time below 10Hz
    # (avg 8.7Hz, max period 0.28s — backlog), and (b) increased wrong-
    # local-minimum failures because the smaller basin of attraction made
    # NDT diverge whenever the previous frame's pose was slightly off.
    # Reverted to the original coarser tuning. Root cause of the
    # zig-zag is elsewhere (gyro_odometer twist / scan_max_range /
    # map quality / initial pose) — to be investigated separately.
    ndt_resolution: 1.8
    #ndt_resolution: 1.2
    ndt_num_threads: 3
    # GICP일 때만 유효
    #gicp_corr_dist_threshold: 5.0
    vg_size_for_input: 0.30
    vg_size_for_map: 0.20
    use_min_max_filter: true
    scan_min_range: 0.5
    # 100 → 50 (2026-06-05): distant points become sparse + noisy and
    # contribute spurious matches; 50m is enough for vehicle localization
    # and also reduces NDT compute load.
    # 50 → 80 (2026-09-11, 확정): 긴 직선 구간에서 종방향 기하 구속이 약해
    # NDT 가 앞뒤로 미끄러지는 문제 때문. 80 m 면 더 먼 건물·표지판이 들어와
    # 종방향을 잡아준다. 대신 연산량과 먼 점의 잡음이 늘어나므로, 센서나 맵을
    # 바꿨다면 fitness_score 와 실시간성(10 Hz 유지)을 다시 확인할 것.
    # 종방향 드리프트가 문제되지 않는 환경이면 50.0 으로 되돌려도 된다.
    scan_max_range: 80.0
    scan_period: 0.1
    set_initial_pose: true
    # Seed for NDT. This MUST match the start of the log being replayed: the
    # scanmatcher latches it before any cloud arrives and NDT cannot recover
    # from a seed outside its convergence basin. raw_drive starts at
    # (0.12, -1.34) and raw_drive3 at (-0.74, 55.71), 57 m apart — replaying
    # raw_drive3 against the old seed left NDT at 78 m error with a matching
    # score of 8.2 instead of 0.037, for the whole run, however long the
    # vehicle stayed parked first.
    # Old seed (raw_drive):
    #   x 0.01269778775459271, y -1.3999424153107651,
    #   qz 0.7103062186114302, qw 0.7038928013568054
    # Deliberately left at the OLD raw_drive start (57 m from raw_drive3's).
    # gnss_initialpose_publisher overrides it at runtime; leaving a stale value
    # here is the test that the seed no longer has to be maintained per log.
    initial_pose_x: -0.8850094792985774
    initial_pose_y: 52.164162275276915
    initial_pose_z: -1.1
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.7009340272485054
    initial_pose_qw: 0.7132261138272992
    use_imu: true
    # Enabled together with the odom_tf_publisher node, which broadcasts
    # odom -> base_link from wheel speed + IMU yaw rate. NDT then advances its
    # per-scan guess by the odometry delta, which constrains the along-track
    # direction that a straight corridor leaves degenerate.
    use_odom: false
    map_path: "/home/misys/lidarslam2_ws/map/0414_down_sample_map/map.pcd"
    publish_tf: false
  
    # map update 전용(slam)
    trans_for_mapupdate: 1.5
    num_targeted_cloud: 15
    map_publish_period: 15.0

    use_sim_time: true