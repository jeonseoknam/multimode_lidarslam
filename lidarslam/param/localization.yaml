scan_matcher:
  ros__parameters:
    global_frame_id: "map"
    robot_frame_id: "base_link"
    registration_method: "NDT"
    # NOTE (2026-06-05): tried ndt_resolution=1.0 + vg_size_for_input=0.15
    # to improve accuracy, but it (a) dropped real-time below 10Hz
    # (avg 8.7Hz, max period 0.28s — backlog), and (b) increased wrong-
    # local-minimum failures because the smaller basin of attraction made
    # NDT diverge whenever the previous frame's pose was slightly off.
    # Reverted to the original coarser tuning. Root cause of the
    # zig-zag is elsewhere (gyro_odometer twist / scan_max_range /
    # map quality / initial pose) — to be investigated separately.
    ndt_resolution: 1.8
    #ndt_resolution: 1.2
    ndt_num_threads: 3
    # GICP일 때만 유효
    #gicp_corr_dist_threshold: 5.0
    vg_size_for_input: 0.30
    vg_size_for_map: 0.20
    use_min_max_filter: true
    scan_min_range: 0.5
    # 100 → 50 (2026-06-05): distant points become sparse + noisy and
    # contribute spurious matches; 50m is enough for vehicle localization
    # and also reduces NDT compute load.
    scan_max_range: 50.0
    scan_period: 0.1
    set_initial_pose: true
    initial_pose_x: 0.01269778775459271
    initial_pose_y: -1.3999424153107651
    initial_pose_z: -1.1
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.7103062186114302
    initial_pose_qw: 0.7038928013568054
    use_imu: true
    use_odom: false
    map_path: "/home/misys/lidarslam2_ws/map/0414_down_sample_map/map.pcd"
    publish_tf: false
  
    # map update 전용(slam)
    trans_for_mapupdate: 1.5
    num_targeted_cloud: 15
    map_publish_period: 15.0

    use_sim_time: true