scan_matcher:
  ros__parameters:
    global_frame_id: "map"
    robot_frame_id: "base_link"
    odom_frame_id: "odom"
    registration_method: "NDT"
    ndt_resolution: 1.8
    ndt_num_threads: 3
    # gicp_corr_dist_threshold: 5.0
    trans_for_mapupdate: 1.5
    vg_size_for_input: 0.22
    vg_size_for_map: 0.16
    # 자차 제거. 이 값들은 use_min_max_filter 가 true 일 때만 쓰인다 -- false 로
    # 두면 scan_min_range 를 아무리 올려도 무시되고 자차 점군이 그대로 지도에 박힌다.
    #
    # 필터는 센서 프레임의 수평거리 sqrt(x^2+y^2) 로 자른다. mapping_0926 bag 실측:
    # 점이 0.87~2.0 m 에 스캔당 약 3,244개(전체의 27%) 찍히고 2.0~4.0 m 는 정확히
    # 0개다. 그 빈 고리가 차체와 바깥 세상의 경계이므로 2.5 m 로 자르면 자차만
    # 사라지고 유효한 점은 하나도 잃지 않는다.
    use_min_max_filter: true
    scan_min_range: 2.5
    # 실측 최대 100.8 m, 100 m 초과는 0.01% 라 사실상 무손실.
    scan_max_range: 100.0
    scan_period: 0.1
    map_publish_period: 15.0
    num_targeted_cloud: 15
    set_initial_pose: true
    initial_pose_x: 0.2957659134323489
    initial_pose_y: 1.1098269642302732
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.7061794053307562
    initial_pose_qw: 0.7080329423739404
    use_imu: true
    use_odom: false
    odom_prior_planar: true
    odom_prior_translation_only: false
    odom_prior_suspect_recovery_only: false
    odom_prior_weight: 1.0
    debug_flag: false

    publish_tf: true

    # 추가
    reject_nonconverged_pose_update: false
    reject_fitness_score: 0.0
    reject_fitness_ratio: 50.0
    reject_fitness_only_ratio: 200.0
    reject_trans_only_ratio: 0.0
    reject_trans_jump: 5.0
    reject_trans_jump_ratio: 20.0
    reject_hard_fitness_ratio: 0.0
    reject_hard_trans_ratio: 0.0
    reject_warmup_scans: 0
    reject_map_update_cooldown_scans: 0
    hard_reject_map_update_cooldown_scans: 0

graph_based_slam:
    ros__parameters:
      registration_method: "NDT"
      ndt_resolution: 1.0
      ndt_num_threads: 2
      voxel_leaf_size: 0.4
      loop_detection_period: 3000
      threshold_loop_closure_score: 1.5
      distance_loop_closure: 100.0
      range_of_searching_loop_closure: 20.0
      search_submap_num: 2
      max_loop_candidate_count: 3
      loop_edge_dedup_index_window: 8
      loop_max_translation_delta: 15.0
      loop_max_rotation_delta_deg: 45.0
      num_adjacent_pose_cnstraints: 5
      use_save_map_in_loop: true
      adjacent_edge_info_weight: 1000.0
      use_gnss: true
      use_odom_input: true

      # navsat | pose | pose_cov
      gnss_constraint_source: "navsat"
      gnss_topic: "/morai/gps/fix"
      gnss_pose_topic: "/ekf_pose"
      gnss_pose_cov_topic: "/ekf_pose_with_covariance"

      gnss_info_weight: 1.0
      gnss_use_covariance_weighting: true
      gnss_covariance_min_variance_m2: 0.01
      gnss_covariance_max_variance_m2: 25.0
      gnss_rtk_fix_max_horizontal_stddev_m: 0.3
      gnss_rtk_fix_weight_scale: 3.0
      gnss_non_rtk_weight_scale: 3.0

      # dynamic object filter
      use_dynamic_object_filter: false
      dynamic_object_filter_voxel_size: 0.3
      dynamic_object_filter_min_observations: 2
      dynamic_object_filter_temporal_window: 5
      dynamic_object_filter_max_range_from_sensor_m: 30.0
      debug_flag: true
